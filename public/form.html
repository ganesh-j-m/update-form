<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Career Katta — College Response Form</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="form-page">
  <div class="form-header">
    <div class="brand-mark">CK</div>
    <div>
      <div class="brand-name" style="color:var(--navy);">Career Katta</div>
      <div class="brand-sub" style="color:var(--ink-soft);">COLLEGE RESPONSE FORM</div>
    </div>
  </div>

  <div class="form-card" id="formCard">
    <img id="formBanner" alt="Form banner" style="display:none; width:100%; max-height:260px; object-fit:cover; border-radius:12px; margin-bottom:18px;">
    <div class="form-hero">
      <h1 id="formTitle">Loading form…</h1>
      <p id="formDesc"></p>
    </div>
    <div class="form-body" id="formBody"></div>
  </div>

  <p class="form-foot-note" id="footNote"></p>
</div>

<div class="toast" id="toast"><span class="dot-gold"></span><span id="toastText"></span></div>

<script src="js/public-form.js"></script>
</body>
</html>
